name: Page checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Homepage byte-identity
        run: cmp dist/index.html public/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run axe (WCAG 2.1 A+AA, all pages)
        run: npm run audit:a11y
      # Gates the policy itself, not just the pages: verify:csp fails if
      # csp.json and vercel.json have drifted, and if any page trips a
      # violation that is not documented as intentional. Without this, a
      # future GTM tag that the policy blocks would be found by a visitor
      # whose analytics quietly stopped.
      - name: Verify Content-Security-Policy
        run: npm run verify:csp
      # The only check that can catch a revert of the consent gate on the
      # session-recording tag. Two of that gate's four layers are GTM and
      # Clarity settings, outside this repo, and verify:csp cannot see them —
      # it grants consent before every page so the CSP entries stay exercised.
      #
      # This makes CI depend on live third-party configuration, which is a real
      # cost: an unrelated pull request goes red if someone edits the GTM
      # container. That is the intended behaviour. The alternative is a session
      # recorder that silently starts running before consent and nothing says so.
      - name: Verify the consent gate on session recording
        run: npm run verify:consent
      # Enforces the article standard, including the
      # cross-article heading check. Both rules it gates hardest were things
      # a human missed by hand: title length, and headings that duplicate an
      # existing article's.
      - name: Validate articles against the content standard
        run: npm run validate:articles
